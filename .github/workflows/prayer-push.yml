name: Prayer reminder push

# Vercel Hobby cron only fires once per day, so this workflow is the real
# scheduler: every 15 minutes it pings the push endpoint, which sends any
# prayer reminders due in the trailing window plus the once-daily verse.
#
# Requires the repository Actions secret CRON_SECRET to match the
# CRON_SECRET environment variable configured in Vercel.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Without this the job sent "Authorization: Bearer " with nothing after it
      # and reported a bare `curl: (22) ... 401`, which reads like a broken
      # endpoint rather than missing configuration. It failed that way 78 times
      # before anyone traced it back to an unset secret.
      - name: Check CRON_SECRET is configured
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in this repository's Actions secrets, so the push endpoint will reject every call with 401. Add it under Settings -> Secrets and variables -> Actions, using the same value as the CRON_SECRET environment variable in Vercel."
            exit 1
          fi

      - name: Trigger push endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail-with-body --max-time 60 \
            "https://livyn-six.vercel.app/api/cron/push?windowMinutes=20" \
            -H "Authorization: Bearer $CRON_SECRET"
