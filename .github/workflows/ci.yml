name: CI

# Lint, types, tests and a production build on every push and pull request.
# Until this existed, nothing checked the repository automatically: type errors
# were suppressed by next.config.ts, and there were no tests to run.

on:
  push:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # A branch with an open pull request would otherwise be checked twice per
    # push — once for the push, once for the pull_request event — so the push
    # trigger is narrowed to the default branch and everything else arrives via
    # its pull request. workflow_dispatch always runs.
    if: >-
      github.event_name != 'push' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # The build needs a signing secret to be present, but never a real one:
        # nothing here talks to the database or issues a token a client will use.
        env:
          JWT_ACCESS_SECRET: ci-build-only-secret-not-used-to-sign-anything
        run: npm run build
